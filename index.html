<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5fb">
  <meta name="description" content="Lleva tus acciones de Pokémon TCG al día. Marca energía, partidario, estadio y habilidades en cada turno.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Turno">
  <title>Turno · Pokémon TCG</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css?v=4e3eae7">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar a los marcadores</a>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M4 16h8m8 0h8"/><circle cx="16" cy="16" r="4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-card-check" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="var(--success)" stroke="none"/><path d="m10 16 4 4 8-9" fill="none" stroke="var(--on-success)" stroke-width="2.4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.3A9 9 0 0 1 10.7 3.5a9 9 0 1 0 9.8 9.8Z"/></symbol>
    <symbol id="i-stadium" viewBox="0 0 24 24"><path d="M4 10v8c0 3 16 3 16 0v-8M4 14c0 3 16 3 16 0M4 9V4m16 5V4M8 8V3m8 5V3"/><ellipse cx="12" cy="10" rx="8" ry="3"/><path d="M9 20v-3m6 3v-3"/></symbol>
    <symbol id="i-supporter" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="9" r="2"/><path d="M8.5 17v-1a3.5 3.5 0 0 1 7 0v1"/></symbol>
    <symbol id="i-energy" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 9-13h-6l1-7Z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-brand"/></svg></span><div><span class="brand-name">turno<span class="brand-dot">.</span></span><span class="brand-description">POKÉMON TCG</span></div></div>
      <div class="header-tools">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Activar modo oscuro" title="Cambiar tema"><svg class="icon"><use id="theme-icon" href="#i-moon"/></svg></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <h1 class="visually-hidden">Marcadores de la partida</h1>
      <div class="play-layout">
        <section class="actions-section" aria-labelledby="actions-heading">
          <div class="section-heading"><h2 id="actions-heading">Acciones</h2></div>
          <div class="action-list">
            <button class="marker action-marker" data-marker="stadium" type="button" aria-pressed="false" aria-label="Estadio: disponible">
              <span class="action-icon stadium-icon"><svg class="icon"><use href="#i-stadium"/></svg></span>
              <span class="action-copy"><span class="marker-title">Estadio</span></span>
              <span class="marker-end"><span class="marker-status" hidden>Usado</span><span class="check-circle"><svg class="icon"><use href="#i-check"/></svg></span></span>
            </button>
            <button class="marker action-marker" data-marker="supporter" type="button" aria-pressed="false" aria-label="Partidario: disponible">
              <span class="action-icon supporter-icon"><svg class="icon"><use href="#i-supporter"/></svg></span>
              <span class="action-copy"><span class="marker-title">Partidario</span></span>
              <span class="marker-end"><span class="marker-status" hidden>Usado</span><span class="check-circle"><svg class="icon"><use href="#i-check"/></svg></span></span>
            </button>
            <button class="marker action-marker" data-marker="energy" type="button" aria-pressed="false" aria-label="Energía del turno: disponible">
              <span class="action-icon energy-icon"><svg class="icon"><use href="#i-energy"/></svg></span>
              <span class="action-copy"><span class="marker-title">Energía</span></span>
              <span class="marker-end"><span class="marker-status" hidden>Usado</span><span class="check-circle"><svg class="icon"><use href="#i-check"/></svg></span></span>
            </button>
          </div>
        </section>

        <section class="pokemon-section" aria-labelledby="pokemon-heading">
          <div class="section-heading"><h2 id="pokemon-heading">Habilidades</h2></div>
          <div class="active-grid">
          <button class="marker pokemon-card active-marker" data-marker="active" type="button" aria-pressed="false" aria-label="Habilidad del Pokémon activo: disponible">
            <span class="card-header"><span class="marker-title">Activo</span></span>
            <span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span>
            <span class="marker-status visually-hidden">Disponible</span>
          </button>
          </div>
          <div class="bench-heading"><h3>Banca</h3></div>
          <div class="bench-grid" aria-label="Habilidades de los Pokémon de la banca">
            <button class="marker pokemon-card bench-marker" data-marker="bench-1" type="button" aria-pressed="false" aria-label="Habilidad de banca 1: disponible"><span class="card-header"><span class="bench-number">01</span></span><span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span class="marker-status visually-hidden">Lista</span></button>
            <button class="marker pokemon-card bench-marker" data-marker="bench-2" type="button" aria-pressed="false" aria-label="Habilidad de banca 2: disponible"><span class="card-header"><span class="bench-number">02</span></span><span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span class="marker-status visually-hidden">Lista</span></button>
            <button class="marker pokemon-card bench-marker" data-marker="bench-3" type="button" aria-pressed="false" aria-label="Habilidad de banca 3: disponible"><span class="card-header"><span class="bench-number">03</span></span><span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span class="marker-status visually-hidden">Lista</span></button>
            <button class="marker pokemon-card bench-marker" data-marker="bench-4" type="button" aria-pressed="false" aria-label="Habilidad de banca 4: disponible"><span class="card-header"><span class="bench-number">04</span></span><span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span class="marker-status visually-hidden">Lista</span></button>
            <button class="marker pokemon-card bench-marker" data-marker="bench-5" type="button" aria-pressed="false" aria-label="Habilidad de banca 5: disponible"><span class="card-header"><span class="bench-number">05</span></span><span class="card-art" aria-hidden="true"><svg class="icon"><use href="#i-brand"/></svg></span><span class="marker-status visually-hidden">Lista</span></button>
          </div>
        </section>
      </div>

      <div id="storage-warning" class="storage-warning" role="status" hidden>El navegador no permite guardar. Mantén esta pestaña abierta para conservar tu turno.</div>
    </main>

  <footer class="bottom-dock"><div class="dock-inner">
    <button id="new-turn" class="primary-button" type="button"><span class="button-orbit" aria-hidden="true"><svg class="icon"><use href="#i-reset"/></svg></span><span>Nuevo turno</span></button>
  </div></footer>
  </div>



  <p id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><div class="noscript">Activa JavaScript para usar los marcadores de Turno.</div></noscript>
</body>
</html>
